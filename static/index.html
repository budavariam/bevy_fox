<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bevy Fox Animation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Bevy Fox Animation...</div>
    <script type="module">
        import init from './bevy_fox.js';
        
        async function run() {
            try {
                await init();
                document.getElementById('loading').style.display = 'none';
    
                // Make canvas fill the screen
                function resizeCanvas() {
                    const canvas = document.querySelector('canvas');
                    if (canvas) {
                        canvas.style.width = "100vw";
                        canvas.style.height = "100vh";
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                    }
                }
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();
            } catch (e) {
                console.error("Error initializing WASM:", e);
                document.getElementById('loading').textContent = 'Failed to load: ' + e.message;
            }
        }
        
        run();
    </script>    
</body>
</html>
